[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cemi"
version = "0.1.0"
description = "CEMÍ — Computer Evidence Monitoring Inspector: local-first, privacy-first desktop security tool."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CEMÍ Contributors" }]
keywords = ["security", "privacy", "local-first", "audit"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "pydantic>=2",
    "typer",
    "jinja2",
    "rich",
    "psutil",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
cemi = "cemi.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cemi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
